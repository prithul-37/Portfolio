<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, SEO, social cards and JSON-LD: rendered from src/content/profile.js -->
    <!--app:head-->

    <!-- Set theme before paint to avoid a flash of the wrong mode. Must stay
         inline and come before the stylesheets. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("pb-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.classList.add("js");   // gates JS-driven motion in CSS

        // Hold the load-in animations at their first frame until the fonts
        // are in (src/main.js releases it); on a cold first visit they would
        // otherwise play while the text is still invisible. Safety net in
        // case the module script never runs.
        document.documentElement.classList.add("anim-wait");
        setTimeout(function () { document.documentElement.classList.remove("anim-wait"); }, 4000);

        // Welcome intro: pick one of the three letter entrances at random.
        // Skipped for reduced motion and for links straight to a section
        // (#contact etc.); without the attribute the intro never shows.
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !location.hash) {
          var dirs = ["right", "top", "bottom"];
          document.documentElement.setAttribute("data-intro", dirs[Math.floor(Math.random() * 3)]);
        }
      })();
    </script>

    <!-- Fonts are self-hosted (src/styles/fonts.css). The two render-critical
         latin faces are preloaded; crossorigin is required even same-origin
         because font fetches are CORS-mode, and omitting it double-downloads. -->
    <link rel="preload" href="/src/assets/Fonts/fraunces-300-700-latin.woff2"
          as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/Fonts/familjen-grotesk-400-700-latin.woff2"
          as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!-- The whole page body is rendered from src/templates + src/content -->
    <!--app:body-->
  </body>
</html>
